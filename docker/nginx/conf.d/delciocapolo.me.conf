server {
  listen 80;
  listen [::]:80;
  server_name delciocapolo.me www.delciocapolo.me;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name delciocapolo.me www.delciocapolo.me;

  ssl_certificate /etc/letsencrypt/live/delciocapolo.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/delciocapolo.me/privkey.pem;

  set $api_upstream http://portfolio-api:3030;
  set $client_upstream http://portfolio-client:3000;

  location ~ ^/(api|upload) {
    limit_req zone=portfolio-api burst=100 nodelay;
    limit_conn conn_limit 50;
    client_max_body_size 50m;
    proxy_buffer_size 512k;
    proxy_buffers 16 512k;
    proxy_busy_buffers_size 1m;
    proxy_max_temp_file_size 0;
    resolver 127.0.0.11 valid=30s;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    limit_req zone=portfolio-client burst=600 delay=400;
    limit_conn conn_limit 80;
    resolver 127.0.0.11 valid=30s;
    proxy_pass $client_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location ~ /\. {
    deny all;
  }
}